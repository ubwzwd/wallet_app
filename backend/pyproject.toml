# Dependencies live in requirements.txt (runtime) and requirements-dev.txt
# (tests); this file only carries project metadata and tool configuration.
# The backend is deployed as a Docker image, not packaged, so there is no
# build system here.
[project]
name = "wallet-app-backend"
version = "3.0.0"
description = "Multi-currency expense tracking API with JWT authentication"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = ["postgres: needs a real Postgres (env TEST_POSTGRES_URL)"]
