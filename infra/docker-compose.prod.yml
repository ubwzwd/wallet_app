# infra/docker-compose.prod.yml - production-shape stack for v3
#   db (Postgres) -> migrate (one-shot alembic) -> api (FastAPI, single uvicorn) -> caddy (TLS + static SPA)
#
# On the VM (from /opt/wallet_app):
#   docker compose -p wallet --env-file infra/.env -f infra/docker-compose.prod.yml up -d --build --wait
# Local smoke test of this exact stack (own project name + ports, tears itself down):
#   bash infra/scripts/smoke.sh
#
# Notes:
# - No fixed container names anywhere: names derive from the compose project (-p), so two
#   projects (e.g. the VM stack and a local smoke run) can coexist on one host.
# - The api runs ONE uvicorn process and must never be scaled: rate limiting is an
#   in-process token bucket (03 sec 8.1). Do not add --workers or `deploy.replicas`.
# - The api has no volumes: the backend keeps no filesystem state (decision 14.28).
# - api:8000 is not published; only Caddy (same compose network) can reach it, which
#   is what makes uvicorn's --forwarded-allow-ips=* safe.
# - Every service reads the same env file: ${WALLET_ENV_FILE:-./.env} (default infra/.env,
#   resolved relative to this file's directory).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: ${WALLET_ENV_FILE:-./.env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Defaults are sized for a 12 GB VM (about 1/4 RAM, 1/4 to 1/2 RAM); override in .env.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=${PG_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}"
      - "-c"
      - "max_connections=50"
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  migrate:
    build:
      # Repo-root context: the image needs backend/ AND skills/wallet-import/
      # (GET /import-format reads the skill deliverables off disk).
      context: ..
      dockerfile: infra/Dockerfile.api
    image: wallet-app/api:local
    env_file: ${WALLET_ENV_FILE:-./.env}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  api:
    # Built by the migrate service above; never pulled from a registry.
    image: wallet-app/api:local
    pull_policy: never
    restart: unless-stopped
    env_file: ${WALLET_ENV_FILE:-./.env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Defaults live HERE, not in the Caddyfile: compose's ${VAR:-default} also applies
    # when the variable is set but empty, while Caddy's {$VAR:default} does not.
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_ACME_CA: ${CADDY_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${WEB_DIST:-../frontend/dist}:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
